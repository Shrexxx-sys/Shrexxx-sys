.sw{animation:sweep 6s ease-in-out infinite}.h1{animation:hl1 6s ease-in-out infinite}.h2{animation:hl2 6s ease-in-out infinite}
.fl{transform-box:fill-box;transform-origin:left center;animation:fill 6s ease-in-out infinite}.lb{animation:lbl 6s ease-in-out infinite}</style>
