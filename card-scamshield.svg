<style>.s{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}@keyframes orbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}.glow{animation:orbit 7s linear infinite}
@keyframes sweep{0%{transform:translateX(0);opacity:0}6%{opacity:1}55%{transform:translateX(252px);opacity:1}60%,100%{transform:translateX(252px);opacity:0}}
